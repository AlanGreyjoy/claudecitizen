[workspace]
members = [
  "crates/protocol",
  "crates/server",
  "crates/sim-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.96"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["http2", "json", "macros"] }
base64 = "0.22.1"
bcrypt = "0.17.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
cookie = "0.18.1"
dotenvy = "0.15.7"
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
jsonwebtoken = { version = "9.3.1", default-features = false }
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
# OTLP over HTTP/protobuf rather than gRPC: `reqwest` is already in the tree for
# Discord and Stripe, so this adds no new transport stack, and OpenObserve's
# ingest is a plain HTTPS endpoint with a Basic auth header.
#
# `reqwest-blocking-client`, NOT `reqwest-client`. The SDK's batch processors run
# on dedicated OS threads with no Tokio reactor, so the async client panics on
# its first export with "there is no reactor running" and takes the exporter
# thread down — traces and logs then silently stop while the process keeps
# serving. The blocking client is the crate's own default for this reason: it
# selects a `NoAsync` retry runtime and builds itself off-runtime. Note the
# selection priority is `reqwest-client` > `hyper-client` > `reqwest-blocking-client`,
# so enabling the async feature anywhere in the tree reintroduces the panic.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
rand = "0.9.2"
rapier3d = { version = "0.34.0", features = ["enhanced-determinism", "serde-serialize"] }
redis = { version = "1.4.0", features = ["aio", "connection-manager", "tokio-comp", "streams"] }
reqwest = { version = "0.13.2", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "compression-gzip", "cors", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
wtransport = "0.7.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
